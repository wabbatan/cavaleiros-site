<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cavaleiros da Ilha · em breve</title>
<meta name="description" content="Cavaleiros da Ilha: um quebra-cabeça de lógica em pixel art. 100 fases, grátis para Android e iOS. Em breve.">
<style>
  :root { --mar:#2b8f9a; --mar2:#1f6f7a; --areia:#f3e3c0; --texto:#fffaf0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background: radial-gradient(ellipse at 50% 35%, var(--mar) 0%, var(--mar2) 75%); color:var(--texto);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; padding:24px 16px; }
  img { width:min(560px, 90vw); height:auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.25)); }
  h1 { font-size:clamp(1.3rem, 4vw, 2rem); margin:28px 0 8px; }
  p { margin:6px 0; font-size:clamp(1rem, 2.8vw, 1.15rem); opacity:.95; }
  a { color:var(--areia); }
  footer { margin-top:48px; font-size:.9rem; opacity:.85; }
</style>
</head>
<body>
  <img src="logo.png" alt="Cavaleiros da Ilha">
  <h1>Em breve</h1>
  <p>Um quebra-cabeça de lógica numa ilha de cavaleiros, dragões e ovelhas.</p>
  <p>100 fases · grátis para Android e iOS · jogue offline</p>
  <p><a href="https://www.instagram.com/cavaleiros_da_ilha/">@cavaleiros_da_ilha</a></p>
  <footer>Um jogo da <a href="https://namustudio.com.br">Daenamu Studio</a></footer>
</body>
</html>
